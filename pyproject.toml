[project]
name = "hr-concierge"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]


dependencies = [
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0,<2.0.0",
    "protobuf>=6.31.1,<7.0.0",
    "mcp>=1.9.0,<2.0.0",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.6.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0,<2.0.0"
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = [
    "E501",  # line too long
    "C901",  # too complex
    "B006",  # mutable default argument
    # The agent replies to employees in Japanese, so full-width punctuation
    # (（）、。) is intended product output rather than a homoglyph smuggled
    # into ASCII. These three rules flagged 66 of 87 findings and buried the
    # real ones.
    "RUF001",  # ambiguous character in a string
    "RUF002",  # ambiguous character in a docstring
    "RUF003",  # ambiguous character in a comment
]

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
# recuse  - correct legal English, appears throughout the customer's handbook
# sme     - Subject Matter Expert
# vas     - a Mermaid node id for the Vertex AI Search / Vector Search box
# fpr     - False Positive Rate, used across the SDD's evaluation chapter
ignore-words-list = "rouge,recuse,sme,vas,fpr"
# `knowledge/` is generated verbatim from the customer's handbook and
# `elevate-apac-m3-policydoc.md` is that handbook. Both are authoritative source
# text that the guardrails quote by section number, so they must never be
# "corrected".
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json,./knowledge/*,./elevate-apac-m3-policydoc.md,./artifacts/*,requirements.lock.txt"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]
